name: Test F4 quote adapter

on:
  pull_request:
    paths:
      - "src/functions/f2/**"
      - "n8n/generated/f2-quote-kernel.generated.js"
      - "tests/f4/**"
      - ".github/workflows/f4-quote-adapter.yml"
  push:
    branches:
      - "feat/f4-*"
    paths:
      - "src/functions/f2/**"
      - "n8n/generated/f2-quote-kernel.generated.js"
      - "tests/f4/**"
      - ".github/workflows/f4-quote-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: F2 vs n8n adapter parity
        run: node --test tests/f4/*.test.mjs
