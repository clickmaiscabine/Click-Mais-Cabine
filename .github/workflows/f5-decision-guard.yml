name: Test F5 decision and shadow guard

on:
  pull_request:
    paths:
      - "src/functions/f2/response-guard.mjs"
      - "n8n/generated/f2-response-guard.generated.js"
      - "n8n/workflows/f5/**"
      - "tests/f5/**"
      - ".github/workflows/f5-decision-guard.yml"
  push:
    branches:
      - "feat/f5-*"
    paths:
      - "src/functions/f2/response-guard.mjs"
      - "n8n/generated/f2-response-guard.generated.js"
      - "n8n/workflows/f5/**"
      - "tests/f5/**"
      - ".github/workflows/f5-decision-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-f5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run F5 contracts and response guard parity
        run: node --test tests/f5/*.test.mjs
