name: Test F6 Trello and follow-up

on:
  pull_request:
    paths:
      - "src/functions/f2/state-guard.mjs"
      - "src/functions/f2/date-promotion.mjs"
      - "n8n/generated/f2-trello-commercial-guard.generated.js"
      - "n8n/generated/f2-followup-policy.generated.js"
      - "n8n/workflows/f6/**"
      - "tests/f6/**"
      - ".github/workflows/f6-trello-followup.yml"
  push:
    branches:
      - "feat/f6-*"
    paths:
      - "src/functions/f2/state-guard.mjs"
      - "src/functions/f2/date-promotion.mjs"
      - "n8n/generated/f2-trello-commercial-guard.generated.js"
      - "n8n/generated/f2-followup-policy.generated.js"
      - "n8n/workflows/f6/**"
      - "tests/f6/**"
      - ".github/workflows/f6-trello-followup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-f6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run F6 projection, Trello guard and follow-up tests
        run: node --test tests/f6/*.test.mjs
