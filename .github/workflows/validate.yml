name: Validate canonical base

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test JavaScript business rules
        run: node --test src/functions/*.test.cjs tests/event-purpose-v1.test.cjs
      - name: Check generated Quote Engine
        run: node scripts/build-quote-engine.mjs --check
      - name: Test Quote Engine and social regression
        run: node --test tests/f2/*.test.mjs tests/f4/*.test.mjs tests/quote-engine/*.test.mjs
      - name: Check generated corporate harness
        run: node scripts/build-corporate-harness.mjs --check
      - name: Verify recorded n8n LAB execution
        run: node scripts/verify-quote-engine-lab.mjs
