name: Test F8 art logistics event

on:
  pull_request:
    paths:
      - "src/functions/f2/readiness.mjs"
      - "src/functions/f2/state-guard.mjs"
      - "n8n/generated/f2-logistics-readiness.generated.js"
      - "n8n/generated/f2-event-date-change-guard.generated.js"
      - "n8n/generated/f2-operational-transition-guard.generated.js"
      - "n8n/workflows/f8/**"
      - "tests/f8/**"
      - ".github/workflows/f8-art-logistics-event.yml"
  push:
    branches:
      - "feat/f8-*"
    paths:
      - "src/functions/f2/readiness.mjs"
      - "src/functions/f2/state-guard.mjs"
      - "n8n/generated/f2-logistics-readiness.generated.js"
      - "n8n/generated/f2-event-date-change-guard.generated.js"
      - "n8n/generated/f2-operational-transition-guard.generated.js"
      - "n8n/workflows/f8/**"
      - "tests/f8/**"
      - ".github/workflows/f8-art-logistics-event.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-f8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run F8 art, logistics and event tests
        run: node --test tests/f8/*.test.mjs
